name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    environment: release
    if: github.repository == 'kachkaev/s20-wifi-setup'
    name: Release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true

      - name: Verify build
        run: pnpm build

      - name: Verify lint
        run: pnpm lint

      - name: Verify bundled CLI
        run: node dist/cli.js --help

      - name: Verify tests
        run: pnpm test

      # npm scans a new version for malware for a few minutes before listing
      # it, so a run right after the one that published sees the version as
      # unpublished and fails with 409 Conflict on publishing it again. The
      # version's tag, which changesets pushes after publishing, does not lag.
      # Drop this check once changesets handles the scan window:
      # https://github.com/changesets/changesets/issues/2195
      - name: Check if the current version is already tagged
        id: version-tag
        run: |
          version=$(node --print "require('./package.json').version")
          if git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # Publishing goes through the action so that it pushes the version's tag
      # (and creates a GitHub release), which the check above relies on
      - name: Create release pull request or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: Version packages
          version-script: pnpm changesets:version
          # An empty script makes the action skip publishing
          publish-script: ${{ steps.version-tag.outputs.exists != 'true' && 'pnpm changesets:publish' || '' }}
