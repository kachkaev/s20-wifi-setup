name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    environment: release
    if: github.repository == 'kachkaev/s20-wifi-setup'
    name: Release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Debug publish context
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "CI=$CI"
          node -v
          npm -v
          pnpm -v
          echo "npm registry: $(npm config get registry)"
          node -e 'const packageJson = require("./package.json"); console.log(JSON.stringify({ name: packageJson.name, version: packageJson.version, publishConfig: packageJson.publishConfig, repository: packageJson.repository }, null, 2));'
          if [ -f "$HOME/.npmrc" ]; then
            echo "~/.npmrc exists before changesets/action"
            sed -E 's#//registry.npmjs.org/:_authToken=.*#//registry.npmjs.org/:_authToken=<redacted>#' "$HOME/.npmrc"
          else
            echo "~/.npmrc does not exist before changesets/action"
          fi

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@c48e67d110a68bc90ccf1098e9646092baacaa87 # v1.6.0
        with:
          publish: pnpm changesets:publish
          title: Version packages
          version: pnpm changesets:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
