name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    environment: release
    if: github.repository == 'kachkaev/s20-wifi-setup'
    name: Release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true

      - name: Verify build
        run: pnpm build

      - name: Verify lint
        run: pnpm lint

      - name: Verify bundled CLI
        run: node dist/cli.js --help

      - name: Verify tests
        run: pnpm test

      # npm scans a new version for malware for a few minutes before listing
      # it, so a run right after the one that published sees the version as
      # unpublished and fails with 409 Conflict on publishing it again. The
      # version's tag, which the publish step below pushes, does not lag.
      # Drop this check once changesets handles the scan window:
      # https://github.com/changesets/changesets/issues/2195
      - name: Check if the current version is already tagged
        id: version-tag
        run: |
          version=$(node --print "require('./package.json').version")
          if git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # Changesets action v2 requires changesets CLI v3, and publishing through
      # v1 would make it write an `.npmrc` with `NPM_TOKEN`, which trusted
      # publishing does not use. So v1 only maintains the release pull request
      # (and sets up the git user that tags need), and publishing happens below
      - name: Create release pull request or prepare publish
        id: changesets
        uses: changesets/action@c48e67d110a68bc90ccf1098e9646092baacaa87 # v1.6.0
        with:
          title: Version packages
          version: pnpm changesets:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` tags the version it publishes but does not push the
      # tag, which the check above needs on the remote
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.version-tag.outputs.exists != 'true'
        run: |
          pnpm changesets:publish
          git push origin --tags
